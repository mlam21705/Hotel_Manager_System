<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- HEAD FRAGMENT -->
    <head th:fragment="head(title)">
        <title th:text="${title}">Housekeeper Dashboard</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        
        <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/open-iconic-bootstrap.min.css">
        <link rel="stylesheet" href="/css/animate.css">
        <link rel="stylesheet" href="/css/owl.carousel.min.css">
        <link rel="stylesheet" href="/css/owl.theme.default.min.css">
        <link rel="stylesheet" href="/css/magnific-popup.css">
        <link rel="stylesheet" href="/css/aos.css">
        <link rel="stylesheet" href="/css/ionicons.min.css">
        <link rel="stylesheet" href="/css/bootstrap-datepicker.css">
        <link rel="stylesheet" href="/css/jquery.timepicker.css">
        <link rel="stylesheet" href="/css/flaticon.css">
        <link rel="stylesheet" href="/css/icomoon.css">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/auth.css">
        <link rel="stylesheet" href="/css/luxury-brand.css">
    </head>

    <!-- NAV BAR FRAGMENT -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="/housekeeper/home">Harbor<span>lights</span></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>

            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item" th:classappend="${activePage == 'home' ? 'active' : ''}"><a href="/housekeeper/home" class="nav-link">Trang chủ</a></li>
                    <li class="nav-item" th:classappend="${activePage == 'tasks' ? 'active' : ''}"><a href="/housekeeper/tasks" class="nav-link">Công việc dọn dẹp</a></li>
                    <li class="nav-item" th:classappend="${activePage == 'problems' ? 'active' : ''}"><a href="/housekeeper/problems" class="nav-link">Báo cáo sự cố</a></li>
                    <li class="nav-item"><a href="#" id="hk-logout-btn" class="nav-link" style="color: #f96d00;">Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SCRIPTS FRAGMENT -->
    <div th:fragment="scripts">
        <script src="/js/jquery.min.js"></script>
        <script src="/js/jquery-migrate-3.0.1.min.js"></script>
        <script src="/js/popper.min.js"></script>
        <script src="/js/bootstrap.min.js"></script>
        <script src="/js/jquery.easing.1.3.js"></script>
        <script src="/js/jquery.waypoints.min.js"></script>
        <script src="/js/jquery.stellar.min.js"></script>
        <script src="/js/owl.carousel.min.js"></script>
        <script src="/js/jquery.magnific-popup.min.js"></script>
        <script src="/js/aos.js"></script>
        <script src="/js/jquery.animateNumber.min.js"></script>
        <script src="/js/bootstrap-datepicker.js"></script>
        <script src="/js/scrollax.min.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/auth.js"></script>

        <script>
            $(document).ready(function() {
                // Logout handler
                if ($('#hk-logout-btn').length > 0) {
                    $('#hk-logout-btn').click(function(e) {
                        e.preventDefault();
                        fetch('/logout', { method: 'POST' })
                            .then(function() {
                                sessionStorage.removeItem('authUser');
                                window.location.href = '/login.html';
                            });
                    });
                }
            });
        </script>
    </div>

</body>
</html>
