<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/admin-header :: head('User Reports')"></head>
<body>

    <nav th:replace="admin/admin-header :: navbar"></nav>

    <div class="hero-wrap" style="background-image: url('/images/bg_3.jpg'); height: 300px;">
        <div class="overlay" style="height: 300px;"></div>
        <div class="container">
            <div class="row no-gutters slider-text align-items-center justify-content-center" style="height: 300px;">
                <div class="col-md-9 text-center">
                    <h1 class="mb-0 bread" style="font-size: 40px;">User Reports</h1>
                    <p class="breadcrumbs">
                        <span class="mr-2"><a href="/admin/home">Admin <i class="fa fa-chevron-right"></i></a></span>
                        <span>Reports</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <section class="ftco-section bg-light">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    
                    <!-- Tabs Nav -->
                    <ul class="nav nav-tabs mb-4" id="reportTabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="customer-tab" data-toggle="tab" href="#customer-reports" role="tab" aria-controls="customer-reports" aria-selected="true" style="font-weight: bold; color: #555;">Customer Reports</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="staff-tab" data-toggle="tab" href="#staff-reports" role="tab" aria-controls="staff-reports" aria-selected="false" style="font-weight: bold; color: #555;">Staff Reports</a>
                        </li>
                    </ul>

                    <!-- Tabs Content -->
                    <div class="tab-content" id="reportTabsContent">
                        
                        <!-- CUSTOMER REPORTS TAB -->
                        <div class="tab-pane fade show active" id="customer-reports" role="tabpanel" aria-labelledby="customer-tab">
                            <div class="bg-white p-4 rounded shadow-sm">
                                <h3 class="mb-4">Reports from Customers</h3>
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead class="thead-dark">
                                            <tr>
                                                <th>ID</th>
                                                <th>Room</th>
                                                <th>Customer</th>
                                                <th>Description</th>
                                                <th>Date</th>
                                                <th>Status</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="report : ${customerReports}">
                                                <td th:text="${report.reportId}"></td>
                                                <td th:text="${report.room.id.branchId + ' - ' + report.room.id.roomNo}"></td>
                                                <td th:text="${report.reportedBy.username}"></td>
                                                <td th:text="${report.issueDescription}"></td>
                                                <td th:text="${#temporals.format(report.reportDate, 'dd/MM/yyyy HH:mm')}"></td>
                                                <td>
                                                    <span class="badge" 
                                                          th:text="${report.resolveStatus.name()}"
                                                          th:classappend="${report.resolveStatus.name() == 'PENDING' ? 'badge-danger' : (report.resolveStatus.name() == 'DONE' ? 'badge-success' : 'badge-warning')}">
                                                    </span>
                                                </td>
                                                <td>
                                                    <a th:href="@{/admin/reports/{id}(id=${report.reportId})}" class="btn btn-sm btn-primary">View</a>
                                                </td>
                                            </tr>
                                            <tr th:if="${customerReports.empty}">
                                                <td colspan="6" class="text-center text-muted">No reports found from customers.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- STAFF REPORTS TAB -->
                        <div class="tab-pane fade" id="staff-reports" role="tabpanel" aria-labelledby="staff-tab">
                            <div class="bg-white p-4 rounded shadow-sm">
                                <h3 class="mb-4">Reports from Staffs</h3>
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead class="thead-dark">
                                            <tr>
                                                <th>ID</th>
                                                <th>Room</th>
                                                <th>Staff Member</th>
                                                <th>Role</th>
                                                <th>Description</th>
                                                <th>Date</th>
                                                <th>Status</th>
                                                <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="report : ${staffReports}">
                                                <td th:text="${report.reportId}"></td>
                                                <td th:text="${report.room.id.branchId + ' - ' + report.room.id.roomNo}"></td>
                                                <td th:text="${report.reportedBy.username}"></td>
                                                <td th:text="${report.reportedBy.role.roleName}"></td>
                                                <td th:text="${report.issueDescription}"></td>
                                                <td th:text="${#temporals.format(report.reportDate, 'dd/MM/yyyy HH:mm')}"></td>
                                                <td>
                                                    <span class="badge" 
                                                          th:text="${report.resolveStatus.name()}"
                                                          th:classappend="${report.resolveStatus.name() == 'PENDING' ? 'badge-danger' : (report.resolveStatus.name() == 'DONE' ? 'badge-success' : 'badge-warning')}">
                                                    </span>
                                                </td>
                                                <td>
                                                    <a th:href="@{/admin/reports/{id}(id=${report.reportId})}" class="btn btn-sm btn-primary">View</a>
                                                </td>
                                            </tr>
                                            <tr th:if="${staffReports.empty}">
                                                <td colspan="7" class="text-center text-muted">No reports found from staffs.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div> <!-- End Tab Content -->
                    
                </div>
            </div>
        </div>
    </section>

    <div th:replace="admin/admin-header :: scripts"></div>
</body>
</html>
