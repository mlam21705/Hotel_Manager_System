<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Customer/customer-header :: head('Hồ sơ cá nhân | Harbor Lights')}"></head>
<body>
<nav th:replace="~{Customer/customer-header :: nav('profile')}"></nav>
<section class="hero-wrap hero-wrap-2 customer-hero" style="background-image: url('/images/bg_1.jpg');">
  <div class="overlay"></div><div class="container"><div class="row no-gutters slider-text align-items-center justify-content-center"><div class="col-md-9 ftco-animate text-center"><p class="breadcrumbs"><span><a href="/customer/home">Trang chủ</a></span></p><h1 class="mb-0 bread">Hồ sơ cá nhân</h1><p class="hero-subtitle">Cập nhật thông tin để khách sạn phục vụ bạn tốt hơn.</p></div></div></div>
</section>
<section class="ftco-section bg-light"><div class="container"><div class="row justify-content-center"><div class="col-lg-9"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="customer-profile-card"><div class="profile-sidebar"><div class="profile-avatar" th:text="${guest != null and guest.guestName != null ? #strings.toUpperCase(#strings.substring(guest.guestName,0,1)) : 'C'}">C</div><h3 th:text="${guest.guestName}">Customer</h3><p th:text="${guest.userAccount.email}">email@example.com</p><span class="profile-role">Customer</span></div><div class="profile-content"><span class="subheading">Thông tin tài khoản</span><h2 class="mb-4">Chỉnh sửa hồ sơ</h2><form th:action="@{/customer/profile}" th:object="${profile}" method="post"><div class="form-group"><label>Họ và tên</label><input type="text" class="form-control" th:field="*{guestName}" required maxlength="100"></div><div class="row"><div class="col-md-6"><div class="form-group"><label>CCCD</label><input type="text" class="form-control" th:field="*{cccd}" required maxlength="20"></div></div><div class="col-md-6"><div class="form-group"><label>Số điện thoại</label><input type="text" class="form-control" th:field="*{phoneNumber}" maxlength="20"></div></div></div><div class="form-group"><label>Địa chỉ</label><textarea class="form-control" rows="4" th:field="*{address}" maxlength="255"></textarea></div><button type="submit" class="btn btn-primary px-5 py-3">Lưu thay đổi</button></form></div></div></div></div></div></section>
<div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>
<div th:replace="~{Customer/customer-header :: scripts}"></div>
</body></html>
