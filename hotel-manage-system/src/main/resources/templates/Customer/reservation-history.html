<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Customer/customer-header :: head('Lịch sử đặt phòng | Harbor Lights')}"></head>
<body>
<nav th:replace="~{Customer/customer-header :: nav('reservations')}"></nav>
<section class="hero-wrap hero-wrap-2 customer-hero" style="background-image: url('/images/bg_1.jpg');">
  <div class="overlay"></div><div class="container"><div class="row no-gutters slider-text align-items-center justify-content-center"><div class="col-md-9 ftco-animate text-center"><p class="breadcrumbs"><span><a href="/customer/home">Trang chủ</a></span></p><h1 class="mb-0 bread">Đặt phòng của tôi</h1><p class="hero-subtitle">Theo dõi tất cả kỳ nghỉ và trạng thái xác nhận.</p></div></div></div>
</section>
<section class="ftco-section bg-light"><div class="container"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="customer-panel ftco-animate"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4"><div><span class="subheading">Lịch sử</span><h2 class="mb-0">Danh sách đặt phòng</h2></div><a th:href="@{/customer/rooms}" class="btn btn-primary mt-3 mt-md-0">Đặt phòng mới</a></div><div class="table-responsive"><table class="table customer-table"><thead><tr><th>Mã đơn</th><th>Ngày tạo</th><th>Trạng thái</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="r : ${reservations}"><td><strong th:text="${'#' + r.reservationId}">#1</strong></td><td th:text="${r.reserveDate}">01/01/2026</td><td><span class="status-badge" th:classappend="${#strings.toLowerCase(r.reservationStatus)}" th:text="${r.reservationStatus}">Pending</span></td><td class="money" th:text="${#numbers.formatDecimal(r.totalAmount,0,'COMMA',0,'POINT') + ' ₫'}">0 ₫</td><td class="text-right"><a th:href="@{/customer/reservations/{id}(id=${r.reservationId})}" class="btn btn-sm btn-primary">Xem chi tiết</a></td></tr><tr th:if="${reservations == null or #lists.isEmpty(reservations)}"><td colspan="5" class="text-center py-5"><span class="empty-icon ion-ios-calendar"></span><p class="mb-3">Bạn chưa có đơn đặt phòng nào.</p><a th:href="@{/customer/rooms}" class="btn btn-primary">Tìm phòng ngay</a></td></tr></tbody></table></div></div></div></section>
<div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>
<div th:replace="~{Customer/customer-header :: scripts}"></div>
</body></html>
