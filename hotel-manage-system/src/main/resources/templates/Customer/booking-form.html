<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Customer/customer-header :: head('Đặt phòng | Harbor Lights')}"></head>
<body>
<nav th:replace="~{Customer/customer-header :: nav('rooms')}"></nav>
<section class="hero-wrap hero-wrap-2 customer-hero" style="background-image: url('/images/bg_1.jpg');">
    <div class="overlay"></div>
    <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center">
            <div class="col-md-9 ftco-animate text-center"><p class="breadcrumbs"><span><a href="/customer/home">Trang chủ</a></span>
            </p>
                <h1 class="mb-0 bread">Xác nhận đặt phòng</h1>
                <p class="hero-subtitle">Kiểm tra lại thông tin trước khi gửi yêu cầu đặt phòng.</p></div>
        </div>
    </div>
</section>
<section class="ftco-section bg-light">
    <div class="container">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="customer-booking-summary">
                    <div class="summary-image" style="background-image:url('/images/room-2.jpg')"></div>
                    <div class="p-4"><span class="subheading">Phòng đã chọn</span>
                        <h3 th:text="${room.roomType.typeName + ' - Phòng ' + room.id.roomNo}">Deluxe - 101</h3>
                        <ul class="summary-list">
                            <li><span>Chi nhánh</span><strong th:text="${room.id.branchId}">1</strong></li>
                            <li><span>Sức chứa tối đa</span><strong th:text="${room.roomType.capacity + ' khách'}">2
                                khách</strong></li>
                            <li><span>Giá mỗi đêm</span><strong
                                    th:text="${#numbers.formatDecimal(room.roomType.basePrice,0,'COMMA',0,'POINT') + ' ₫'}">0
                                ₫</strong></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="customer-panel"><h3 class="mb-4">Thông tin lưu trú</h3>
                    <form th:action="@{/customer/booking}" th:object="${bookingRequest}" method="post"><input
                            type="hidden" th:field="*{branchId}"><input type="hidden" th:field="*{roomNo}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group"><label>Ngày nhận phòng</label><input type="date"
                                                                                             class="form-control"
                                                                                             th:field="*{checkInDate}"
                                                                                             required></div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group"><label>Ngày trả phòng</label><input type="date"
                                                                                            class="form-control"
                                                                                            th:field="*{checkOutDate}"
                                                                                            required></div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group"><label>Số khách</label><input type="number" min="1"
                                                                                      class="form-control"
                                                                                      th:max="${room.roomType.capacity}"
                                                                                      th:field="*{numberOfGuest}"
                                                                                      required></div>
                            </div>
                        </div>
                        <hr>
                        <h4 class="mb-3">Dịch vụ bổ sung</h4>
                        <div class="service-choice" th:each="s : ${services}"><label class="service-option"><input
                                type="checkbox" th:field="*{serviceIds}" th:value="${s.serviceId}"><span
                                class="checkmark"></span><span class="service-name"
                                                               th:text="${s.serviceName}">Breakfast</span><strong
                                th:text="${#numbers.formatDecimal(s.servicePrice,0,'COMMA',0,'POINT') + ' ₫'}">0
                            ₫</strong></label></div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">Xác nhận đặt phòng</button>
                        <a th:href="@{/customer/rooms}" class="btn btn-link btn-block">Quay lại tìm phòng</a></form>
                </div>
            </div>
        </div>
    </div>
</section>
<div id="ftco-loader" class="show fullscreen">
    <svg class="circular" width="48px" height="48px">
        <circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/>
        <circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10"
                stroke="#F96D00"/>
    </svg>
</div>
<div th:replace="~{Customer/customer-header :: scripts}"></div>
</body>
</html>
