<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- HEAD FRAGMENT -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">Harbor Lights</title>

    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/open-iconic-bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/animate.css}">
    <link rel="stylesheet" th:href="@{/css/owl.carousel.min.css}">
    <link rel="stylesheet" th:href="@{/css/owl.theme.default.min.css}">
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" th:href="@{/css/aos.css}">
    <link rel="stylesheet" th:href="@{/css/ionicons.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-datepicker.css}">
    <link rel="stylesheet" th:href="@{/css/jquery.timepicker.css}">
    <link rel="stylesheet" th:href="@{/css/flaticon.css}">
    <link rel="stylesheet" th:href="@{/css/icomoon.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/luxury-brand.css}">
    <link rel="stylesheet" th:href="@{/css/customer-theme.css}">
</head>

<!-- NAV BAR FRAGMENT -->
<nav th:fragment="nav(activePage)"
     class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light customer-navbar" id="ftco-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/customer/home}">Harbor<span>lights</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#customer-nav"
                aria-controls="customer-nav" aria-expanded="false" aria-label="Mở menu"><span class="oi oi-menu"></span>
            Menu
        </button>
        <div class="collapse navbar-collapse" id="customer-nav">
            <ul class="navbar-nav ml-auto align-items-lg-center">
                <li class="nav-item" th:classappend="${activePage == 'home'} ? 'active'"><a th:href="@{/customer/home}"
                                                                                            class="nav-link">Trang
                    chủ</a></li>
                <li class="nav-item" th:classappend="${activePage == 'rooms'} ? 'active'"><a
                        th:href="@{/customer/rooms}" class="nav-link">Tìm phòng</a></li>
                <li class="nav-item" th:classappend="${activePage == 'reservations'} ? 'active'"><a
                        th:href="@{/customer/reservations}" class="nav-link">Lịch sử đặt phòng</a></li>
                <li class="nav-item" th:classappend="${activePage == 'profile'} ? 'active'"><a
                        th:href="@{/customer/profile}" class="nav-link">Hồ sơ</a></li>
                <li class="nav-item ml-lg-2">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-primary customer-logout">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- SCRIPTS FRAGMENT -->
<div th:fragment="scripts">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/jquery-migrate-3.0.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/jquery.easing.1.3.js}"></script>
    <script th:src="@{/js/jquery.waypoints.min.js}"></script>
    <script th:src="@{/js/jquery.stellar.min.js}"></script>
    <script th:src="@{/js/owl.carousel.min.js}"></script>
    <script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
    <script th:src="@{/js/aos.js}"></script>
    <script th:src="@{/js/jquery.animateNumber.min.js}"></script>
    <script th:src="@{/js/bootstrap-datepicker.js}"></script>
    <script th:src="@{/js/scrollax.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</div>

</body>
</html>
