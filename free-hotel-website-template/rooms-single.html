<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Harborlights - Free Bootstrap 4 Template by Colorlib</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
  <link rel="stylesheet" href="css/animate.css">

  <link rel="stylesheet" href="css/owl.carousel.min.css">
  <link rel="stylesheet" href="css/owl.theme.default.min.css">
  <link rel="stylesheet" href="css/magnific-popup.css">

  <link rel="stylesheet" href="css/aos.css">

  <link rel="stylesheet" href="css/ionicons.min.css">

  <link rel="stylesheet" href="css/bootstrap-datepicker.css">
  <link rel="stylesheet" href="css/jquery.timepicker.css">


  <link rel="stylesheet" href="css/flaticon.css">
  <link rel="stylesheet" href="css/icomoon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/luxury-brand.css">
</head>

<body>

  <div id="header-container" th:replace="~{header :: navbar}"></div>
  <div class="hero-wrap" style="background-image: url('images/bg_3.jpg');">
    <div class="overlay"></div>
    <div class="container">
      <div class="row no-gutters slider-text d-flex align-itemd-center justify-content-center">
        <div class="col-md-9 ftco-animate text-center d-flex align-items-end justify-content-center">
          <div class="text">
            <p class="breadcrumbs mb-2"><span class="mr-2"><a href="index.html">Home</a></span> <span class="mr-2"><a
                  href="rooms.html">Rooms</a></span> <span id="room-detail-breadcrumb" th:text="${roomType.typeName}">Rooms Single</span></p>
            <h1 class="mb-4 bread">Rooms Details</h1>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="ftco-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="row">
            <div class="col-md-12 ftco-animate">
              <div class="single-slider owl-carousel">
                <!-- Server-rendered image slides -->
                <div class="item" th:if="${roomType.images == null or #lists.isEmpty(roomType.images)}">
                  <div class="room-img" style="background-image: url(images/room-4.jpg);"></div>
                </div>
                <div class="item" th:each="img : ${roomType.images}">
                  <div class="room-img" th:style="'background-image: url(' + ${img.imageUrl} + ');'"></div>
                </div>
              </div>
            </div>
            <div class="col-md-12 room-single mt-4 mb-5 ftco-animate">
              <h2 class="mb-4" id="room-detail-title" th:text="${roomType.typeName}">Luxury Room</h2>
              <p id="room-detail-desc" th:text="${roomType.description} ?: 'No description available.'">Description</p>
              <div class="d-md-flex mt-5 mb-5">
                <ul class="list" id="room-detail-specs">
                  <li><span>Max:</span> <span th:text="${roomType.capacity}">3</span> Persons</li>
                  <li><span>Size:</span> 45 m2</li>
                  <li><span>Price:</span> <span th:text="${#numbers.formatInteger(roomType.basePrice, 1, 'POINT')} + ' ₫'">$120.00</span></li>
                  <li><span>Bed:</span> <span th:text="${roomType.capacity > 2} ? 2 : 1">1</span></li>
                </ul>
              </div>
            </div>
            <div class="col-md-12 room-single ftco-animate mb-5 mt-4">
              <h3 class="mb-4">Take A Tour</h3>
              <div class="block-16">
                <figure>
                  <iframe width="100%" height="600" src="https://www.youtube.com/embed/r8Z5lrDouws"
                    title="YouTube video player" frameborder="0" allowfullscreen></iframe>
                </figure>
              </div>
            </div>

            <div class="col-md-12 text-center ftco-animate">
              <p><a href="https://api.whatsapp.com/send/?phone=6281999483864&text=hello%20saya%20mau%20booking%20hotel"
                  target="_blank" class="px-5 py-4 btn btn-primary rounded">Booking Sekarang</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section> <!-- .section -->


  <div id="footer-container" th:replace="~{footer :: footer}"></div>



  <!-- loader -->
  <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px">
      <circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee" />
      <circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10"
        stroke="#F96D00" />
    </svg></div>


  <script src="js/jquery.min.js"></script>
  <script src="js/jquery-migrate-3.0.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/jquery.easing.1.3.js"></script>
  <script src="js/jquery.waypoints.min.js"></script>
  <script src="js/jquery.stellar.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/jquery.magnific-popup.min.js"></script>
  <script src="js/aos.js"></script>
  <script src="js/jquery.animateNumber.min.js"></script>
  <script src="js/bootstrap-datepicker.js"></script>
  <script src="js/scrollax.min.js"></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
  <script src="js/google-map.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
