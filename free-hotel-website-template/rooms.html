<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Harborlights - Free Bootstrap 4 Template by Colorlib</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,600,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">

    <link rel="stylesheet" href="css/aos.css">

    <link rel="stylesheet" href="css/ionicons.min.css">

    <link rel="stylesheet" href="css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="css/jquery.timepicker.css">

    
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/luxury-brand.css">
  </head>
  <body>

    <div id="header-container" th:replace="~{header :: navbar}"></div>
		<div class="hero-wrap" style="background-image: url('images/bg_3.jpg');">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text d-flex align-itemd-center justify-content-center">
          <div class="col-md-9 ftco-animate text-center d-flex align-items-end justify-content-center">
          	<div class="text">
	            <p class="breadcrumbs mb-2"><span class="mr-2"><a href="index.html">Home</a></span> <span>Restaurant</span></p>
	            <h1 class="mb-4 bread">Rooms</h1>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="ftco-section ftco-no-pb ftco-room">
    	<div class="container-fluid px-0">
    		<div class="row no-gutters justify-content-center mb-5 pb-3">
          <div class="col-md-7 heading-section text-center ftco-animate">
          	<span class="subheading">Harbor Lights Rooms</span>
            <h2 class="mb-4">Hotel Master's Rooms</h2>
          </div>
        </div>  
    		<div class="row no-gutters" id="rooms-container">
    			<!-- No rooms message -->
    			<div class="col-md-12 text-center py-5" th:if="${#lists.isEmpty(roomTypes)}">
    				<h3>No room types found.</h3>
    			</div>

    			<!-- Server-rendered room cards -->
    			<div class="col-lg-6 ftco-animate fadeInUp ftco-animated"
    			     th:each="rt, stat : ${roomTypes}"
    			     th:with="imgs=${rt.images},
    			              imageRight=${(stat.index / 2) % 2 == 1},
    			              primaryList=${rt.images == null ? null : rt.images.?[isPrimary == true]},
    			              imageUrl=${rt.images == null or #lists.isEmpty(rt.images)
    			                         ? 'images/room-1.jpg'
    			                         : (primaryList != null and !#lists.isEmpty(primaryList) ? primaryList[0].imageUrl : rt.images[0].imageUrl)}">
    				<div class="room-wrap d-md-flex">
    					<a th:href="@{/rooms-single.html(id=${rt.roomTypeId})}"
    					   class="img" th:classappend="${imageRight} ? 'order-md-last'"
    					   th:style="'background-image: url(' + ${imageUrl} + ');'"></a>
    					<div class="half d-flex align-items-center" th:classappend="${imageRight} ? 'right-arrow' : 'left-arrow'">
    						<div class="text p-4 text-center">
    							<p class="star mb-0">
    								<span class="ion-ios-star"></span>
    								<span class="ion-ios-star"></span>
    								<span class="ion-ios-star"></span>
    								<span class="ion-ios-star"></span>
    								<span class="ion-ios-star"></span>
    							</p>
    							<p class="mb-0">
    								<span class="price mr-1" th:text="${#numbers.formatInteger(rt.basePrice, 1, 'POINT')} + ' ₫'">0 ₫</span>
    								<span class="per">per night</span>
    							</p>
    							<h3 class="mb-3"><a th:href="@{/rooms-single.html(id=${rt.roomTypeId})}" th:text="${rt.typeName}">Room Type</a></h3>
    							<p class="pt-1"><a th:href="@{/rooms-single.html(id=${rt.roomTypeId})}" class="btn-custom px-3 py-2 rounded">View Details <span class="icon-long-arrow-right"></span></a></p>
    						</div>
    					</div>
    				</div>
    			</div>
    		</div>
    	</div>
    </section>


    <div id="footer-container" th:replace="~{footer :: footer}"></div>
    
  

  <!-- loader -->
  <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>


  <script src="js/jquery.min.js"></script>
  <script src="js/jquery-migrate-3.0.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/jquery.easing.1.3.js"></script>
  <script src="js/jquery.waypoints.min.js"></script>
  <script src="js/jquery.stellar.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/jquery.magnific-popup.min.js"></script>
  <script src="js/aos.js"></script>
  <script src="js/jquery.animateNumber.min.js"></script>
  <script src="js/bootstrap-datepicker.js"></script>
  <script src="js/scrollax.min.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
  <script src="js/google-map.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>

  </body>
</html>
